name: refresh-vlr-data

# Scrape la saison VCT sur vlr.gg et commite les fichiers bruts (data/raw) sur la branche.
# Lancement : onglet Actions > refresh-vlr-data > Run workflow, ou push sur data-refresh/*.
on:
  workflow_dispatch:
    inputs:
      season:
        description: Saison VCT
        default: "2026"
  push:
    branches: ["data-refresh/**"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEASON: ${{ inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Scrape vlr.gg
        run: python -c "import os; from vlr_analytics.scraping.vlr import scrape_season; scrape_season(int(os.environ['SEASON']))"
      - name: Commit des fichiers bruts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && { echo "Pas de changement"; exit 0; }
          git commit -m "data: scrape vlr.gg saison $SEASON"
          git push
