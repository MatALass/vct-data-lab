name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests et rapport Power BI à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,powerbi]"
      - run: pytest -q
      - name: Le projet PBIP Meta Lens versionné correspond au script
        run: |
          python powerbi/meta_lens/build_report.py
          git diff --exit-code -- powerbi/meta_lens/VCTMetaLens
